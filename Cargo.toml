[workspace]
members = ["crates/tst-core", "crates/tst-daemon"]
resolver = "2"

[workspace.package]
version = "0.2.0-alpha.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/cuppet-ai/cuppet"
rust-version = "1.82"

[workspace.dependencies]
anyhow = "1.0.98"
crc32fast = "1.4.2"
fs2 = "0.4.3"
hex = "0.4.3"
ignore = "0.4.23"
notify = "8.0.0"
rmp-serde = "1.3.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
tempfile = "3.19.1"
thiserror = "2.0.12"
tokio = { version = "1.44.2", features = ["full"] }
tree-sitter = "0.24.7"
tree-sitter-go = "0.23.4"
tree-sitter-javascript = "0.23.1"
tree-sitter-python = "0.23.6"
tree-sitter-rust = "0.23.2"
tree-sitter-typescript = "0.23.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
