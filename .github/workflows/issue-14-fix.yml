name: issue-14-fix

on:
  push:
    branches:
      - fix/pe3-issues-14-16-18-17-15-19-20

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pe3-issues-14-16-18-17-15-19-20
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply issue 14 fix
        run: |
          python - <<'PY'
          from pathlib import Path

          task = Path('packages/cli/src/pe3/task-agents.ts')
          text = task.read_text()
          old = "| { action: 'continue'; agent: TaskAgentState; reason: string; affinity: TaskAffinity; semanticEligible?: boolean }"
          new = "| { action: 'continue'; agent: TaskAgentState; reason: string; affinity: TaskAffinity; semanticEligible?: boolean; semanticReturnOnly?: boolean }"
          assert old in text
          text = text.replace(old, new, 1)

          old = """        ...(semanticEscalationEligible(prompt, currentAffinity) ? { semanticEligible: true } : {}),\n"""
          new = """        ...(semanticEscalationEligible(prompt, currentAffinity)\n          ? { semanticEligible: true, ...(explicitReturn ? { semanticReturnOnly: true } : {}) }\n          : {}),\n"""
          assert old in text
          text = text.replace(old, new, 1)

          old = """  if (hasCue(normalized, CONTINUATION_CUES) || hasCue(normalized, SWITCH_CUES) || hasCue(normalized, RETURN_CUES)) return false\n"""
          new = """  if (hasCue(normalized, CONTINUATION_CUES) || hasCue(normalized, SWITCH_CUES)) return false\n"""
          assert old in text
          text = text.replace(old, new, 1)
          task.write_text(text)

          session = Path('packages/cli/src/pe3/session-router.ts')
          text = session.read_text()
          old = """    if (decision.action === 'create') {\n      return {\n        action: 'create',\n        reason: decision.reason,\n        affinity: deterministic.affinity,\n      }\n    }\n"""
          new = """    if (decision.action === 'create') {\n      if (deterministic.semanticReturnOnly) {\n        return {\n          ...deterministic,\n          reason: 'explicit return had no decisive dormant semantic match; preserve the active task',\n          semanticEligible: false,\n          semanticReturnOnly: false,\n        }\n      }\n      return {\n        action: 'create',\n        reason: decision.reason,\n        affinity: deterministic.affinity,\n      }\n    }\n"""
          assert old in text
          text = text.replace(old, new, 1)
          session.write_text(text)

          tests = Path('packages/cli/test/pe3-session-router.test.ts')
          text = tests.read_text()
          anchor = """test('cheap TST-style code localization resolves natural boundary before embeddings', async () => {\n"""
          assert anchor in text
          addition = """test('explicit return with a vocabulary gap semantically reactivates the dormant session', async () => {\n  const router = semanticSessionRouter()\n  const harness = adapterHarness()\n\n  const auth = await router.prepare('fix refresh token expiration', harness.adapter)\n  await router.prepare('separately, new task: build csv export pagination', harness.adapter)\n  const returned = await router.prepare('go back to the credential renewal problem', harness.adapter)\n\n  assert.equal(returned.action, 'reactivate')\n  assert.equal(returned.sessionID, auth.sessionID)\n  assert.equal(harness.created, 2)\n  assert.deepEqual(harness.resumed, [auth.sessionID])\n  assert.equal(router.stats().semanticReactivated, 1)\n})\n\ntest('explicit return with no decisive dormant match stays on the active session and never creates', async () => {\n  const router = semanticSessionRouter()\n  const harness = adapterHarness()\n\n  await router.prepare('fix refresh token expiration', harness.adapter)\n  const analytics = await router.prepare('separately, new task: build csv export pagination', harness.adapter)\n  const returned = await router.prepare('go back to websocket observability cleanup', harness.adapter)\n\n  assert.equal(returned.action, 'continue')\n  assert.equal(returned.sessionID, analytics.sessionID)\n  assert.equal(harness.created, 2)\n  assert.deepEqual(harness.resumed, [])\n  const stats = router.stats()\n  assert.equal(stats.semanticEscalations, 1)\n  assert.equal(stats.semanticCreated, 1)\n  assert.equal(stats.created, 2)\n})\n\n"""
          text = text.replace(anchor, addition + anchor, 1)
          tests.write_text(text)
          PY
      - name: Typecheck CLI
        run: npm run typecheck --workspace=cuppet
      - name: Test task routing
        run: >-
          node --import tsx --test
          packages/cli/test/task-agents.test.ts
          packages/cli/test/pe3-session-router.test.ts
          packages/cli/test/pe3-semantic-router.test.ts
          packages/cli/test/pe3-adversarial-routing.test.ts
          packages/cli/test/pe3-fallback-regression.test.ts
      - name: Commit verified fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git rm .github/workflows/issue-14-fix.yml
          git add packages/cli/src/pe3/task-agents.ts packages/cli/src/pe3/session-router.ts packages/cli/test/pe3-session-router.test.ts
          git commit -m "fix(pe3): allow semantic dormant matching for explicit returns (#14)"
          git push origin HEAD:fix/pe3-issues-14-16-18-17-15-19-20
