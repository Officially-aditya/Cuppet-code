name: C1 rustfmt fix

on:
  push:
    branches:
      - desktop-c1-tst-edit-rpc

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-c1-tst-edit-rpc
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tst-core/src/editing.rs crates/tst-daemon/src/main.rs
          git commit -m "style(tst): apply rustfmt"
          git push origin HEAD:desktop-c1-tst-edit-rpc
