name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        include:
          - os: macos-13
          - os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 49c69c5ed3ccf706b61b3febb43c8aaff7f8325e
          path: .opencode-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-opencode-${{ hashFiles('.opencode-src/bun.lock') }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      - run: npm run build
      - name: Build audited OpenCode contract binary
        run: node scripts/build-opencode.mjs --source=.opencode-src --output=.opencode/opencode
      - run: npm run check
      - run: npm run fmt:check
      - run: npm run lint
      - run: npm test
        env:
          CUPPET_CONTRACT_OPENCODE_BIN: ${{ github.workspace }}/.opencode/opencode
          CUPPET_TEST_TST_BIN: ${{ github.workspace }}/target/debug/tst-daemon

  security:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit
      - run: |
          ! rg -n '(readFile|open).*\.(claude\.json|cuppet/(credentials|ltm-trie)\.json)' packages crates
