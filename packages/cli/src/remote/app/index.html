<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0b0e14" />
<link rel="manifest" href="/app/manifest.webmanifest" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2313a4a0'/%3E%3Ctext x='16' y='23' font-size='19' font-family='monospace' fill='%230b0e14' text-anchor='middle'%3E%C2%A5%3C/text%3E%3C/svg%3E" />
<title>Cuppet Remote</title>
<link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
<div id="pair-screen" class="screen hidden">
  <div class="pair-card">
    <h1>Cuppet Remote</h1>
    <p>Pair this device with your machine.</p>
    <label>Pairing code
      <input id="pair-code" inputmode="text" autocapitalize="characters" autocomplete="off" placeholder="ABC123XYZ" maxlength="16" />
    </label>
    <label>Device name
      <input id="pair-name" placeholder="My phone" maxlength="64" />
    </label>
    <button id="pair-button" class="primary">Pair device</button>
    <p id="pair-error" class="error"></p>
    <p id="pair-status" class="muted"></p>
  </div>
</div>

<div id="app-screen" class="screen hidden">
  <header>
    <div class="host-line">
      <span id="conn-dot" class="dot off"></span>
      <span id="host-name">…</span>
      <span id="busy-badge" class="badge hidden">running</span>
      <button id="refresh-button" title="refresh pending prompts">⟳</button>
    </div>
    <div class="model-line">
      <select id="model-select"></select>
      <span id="usage-line" class="muted"></span>
    </div>
  </header>

  <nav id="session-bar">
    <select id="session-select"></select>
    <button id="new-session">＋</button>
    <button id="plan-toggle" title="toggle plan mode">plan</button>
    <button id="undo-button" title="undo last change">undo</button>
    <button id="compact-button" title="compact context">cmp</button>
    <button id="abort-button" class="danger hidden" title="abort agent">■ stop</button>
  </nav>

  <main id="transcript"></main>

  <section id="pending"></section>

  <footer id="composer">
    <textarea id="composer-input" rows="1" placeholder="Message Cuppet…"></textarea>
    <button id="send-button" class="primary">Send</button>
  </footer>
</div>

<script src="/app/app.js"></script>
</body>
</html>
