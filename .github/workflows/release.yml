name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-prefixed release tag
        required: true
      publish:
        description: Publish to npm and create the GitHub release
        type: boolean
        default: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write
  id-token: write
  packages: write

jobs:
  build-platform:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            target: x86_64-apple-darwin
            package_dir: runtime-darwin-x64
          - os: macos-14
            target: aarch64-apple-darwin
            package_dir: runtime-darwin-arm64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            package_dir: runtime-linux-x64-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            package_dir: runtime-linux-arm64-gnu
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            package_dir: runtime-win32-x64
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            package_dir: runtime-win32-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 16747470f976aca3d362ad730bcd3fe82ecc2c9a
          path: .opencode-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88
          targets: ${{ matrix.target }}
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-${{ runner.arch }}-bun-opencode-${{ hashFiles('.opencode-src/bun.lock') }}
      - name: Validate release tag
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('release tag/version mismatch')"
        env:
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
      - run: npm ci
      - run: npm run build:ts
      - run: cargo build --workspace --release --locked --target=${{ matrix.target }}
      - name: Build audited OpenCode binary
        run: node scripts/build-opencode.mjs --source=.opencode-src --output=.opencode/opencode
      - name: Run npm test
        # PowerShell is the default shell on Windows runners, but this retry
        # uses POSIX shell syntax, so pin bash on every platform.
        shell: bash
        run: |
          if npm test; then
            exit 0
          fi
          if [[ "${{ matrix.os }}" != macos-* ]]; then
            exit 1
          fi
          echo "macOS tests failed once; retrying once for transient runner failures"
          npm test
        env:
          CUPPET_CONTRACT_OPENCODE_BIN: ${{ github.workspace }}/.opencode/opencode
          CUPPET_TEST_TST_BIN: ${{ github.workspace }}/target/${{ matrix.target }}/release/tst-daemon
      # Signing and notarization are optional. Apple credentials live in
      # human-owned accounts and have not always been configured, and a
      # release that blocks on them publishes nothing at all: `publish` needs
      # every matrix job, so one unsigned-forbidden macOS failure skips the
      # npm publish entirely. When the secrets are absent the macOS runtimes
      # are still built and published unsigned.
      #
      # The set is all-or-nothing. A partial set would sign with a key that is
      # never notarized, so any missing secret disables signing wholesale
      # rather than failing mid-job. package-platform.mjs refuses to emit an
      # unsigned macOS runtime unless CUPPET_ALLOW_UNSIGNED=1, which is why
      # the flag comes from this step instead of being hardcoded.
      - name: Detect Apple signing configuration
        id: apple
        if: startsWith(matrix.target, 'aarch64-apple') || startsWith(matrix.target, 'x86_64-apple')
        shell: bash
        env:
          P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          missing=""
          for secret in P12 P12_PASSWORD SIGN_IDENTITY NOTARY_APPLE_ID NOTARY_TEAM_ID NOTARY_APP_PASSWORD; do
            if [[ -z "${!secret}" ]]; then
              missing="${missing}${missing:+, }${secret}"
            fi
          done
          if [[ -z "$missing" ]]; then
            echo "signing=true" >> "$GITHUB_OUTPUT"
            echo "allow_unsigned=" >> "$GITHUB_OUTPUT"
          else
            echo "signing=false" >> "$GITHUB_OUTPUT"
            echo "allow_unsigned=1" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets missing (${missing}); publishing unsigned macOS runtimes. Gatekeeper will block these binaries until they are signed or explicitly allowed."
          fi
      - uses: apple-actions/import-codesign-certs@v3
        if: steps.apple.outputs.signing == 'true'
        with:
          p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - run: node scripts/package-platform.mjs --target=${{ matrix.target }}
        env:
          CUPPET_OPENCODE_BIN: ${{ github.workspace }}/.opencode/opencode
          CUPPET_APPLE_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
          CUPPET_ALLOW_UNSIGNED: ${{ steps.apple.outputs.allow_unsigned }}
      - name: Package standalone TST runtime
        # Quote the interpolated Windows paths so backslashes survive the shell.
        run: node scripts/package-tst-runtime.mjs --source="${{ github.workspace }}/artifacts/${{ matrix.package_dir }}/bin/tst-daemon" --target=${{ matrix.target }} --output="${{ github.workspace }}/artifacts/tst-${{ matrix.package_dir }}"
      - name: Notarize macOS runtime
        if: steps.apple.outputs.signing == 'true'
        run: |
          ditto -c -k --keepParent "artifacts/${{ matrix.package_dir }}" runtime.zip
          xcrun notarytool submit runtime.zip --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: cuppet-${{ matrix.target }}
          path: artifacts/
          include-hidden-files: true

  publish:
    needs: build-platform
    runs-on: ubuntu-24.04
    # Only the two mutating steps below are gated. The npm environment is not
    # declared on this job so a build-only run is never held waiting for an
    # approval that is not needed yet.
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Restore runtime executable permissions
        # Windows artifacts carry `.exe` binaries without POSIX execute bits;
        # verify-release.mjs skips the mode check for them, but keep any
        # POSIX binaries executable after the artifact round-trip.
        run: find artifacts -type f \( -name opencode -o -name tst-daemon \) -exec chmod 755 {} +
      - run: npm ci
      - run: npm run build:ts
      - name: Create and verify installable npm bundle
        run: npm run package:cli
      - run: node scripts/verify-release.mjs artifacts
        env:
          CUPPET_VERIFY_EXECUTABLES: '0'
      - name: Publish to npm
        # Publishing is opt-in so a tag push can prove the six platform builds
        # and the assembled bundle without spending an immutable version
        # number. This step needs all six matrix jobs, so a mid-matrix failure
        # consumes the version even when nothing reaches the registry: npm will
        # not overwrite a published version, and publish-release.mjs's preflight
        # refuses to repair a partially released version because only a new
        # version can. Building first turns that into a re-runnable step.
        #
        # `environment` is declared on this step, not the job, so the npm
        # approval gate still applies to the publish while a build-only run is
        # not held waiting for an approval it does not need.
        if: ${{ inputs.publish == true }}
        environment: npm
        run: node scripts/publish-release.mjs artifacts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create downloadable release assets
        run: node scripts/create-release-assets.mjs artifacts release-assets
      - uses: actions/upload-artifact@v4
        with:
          name: cuppet-release-assets
          path: release-assets/
      - name: Create or update GitHub release
        # Gated with the npm publish so a build-only run does not create a
        # public release pointing at a version that is not on the registry.
        if: ${{ inputs.publish == true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ env.RELEASE_TAG }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
          elif [[ "$RELEASE_TAG" == *-* ]]; then
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes --prerelease
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --generate-notes
          fi
