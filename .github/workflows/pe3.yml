name: pe3

on:
  pull_request:
    paths:
      - 'packages/cli/src/pe3/**'
      - 'packages/cli/src/benchmark/pe3-routing.ts'
      - 'packages/cli/src/control/server.ts'
      - 'packages/cli/src/cli.tsx'
      - 'packages/cli/test/task-agents.test.ts'
      - 'packages/cli/test/pe3-*.test.ts'
      - 'packages/cli/test/control.test.ts'
      - 'packages/cli/package.json'
      - 'packages/opencode-plugin/src/pe3-tui.ts'
      - 'packages/opencode-plugin/src/tui-entry.ts'
      - 'packages/opencode-plugin/test/pe3-tui.test.ts'
      - 'packages/opencode-plugin/tsup.config.ts'
      - 'patches/opencode/0016-cuppet-pe3-native-routing.patch'
      - 'scripts/pe3-routing-benchmark.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/pe3.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      # CI uses injected deterministic vectors; never fetch model assets just
      # because a regression test reaches the semantic ambiguity band.
      CUPPET_PE3_ALLOW_MODEL_DOWNLOAD: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anomalyco/opencode
          ref: 49c69c5ed3ccf706b61b3febb43c8aaff7f8325e
          path: .opencode-src
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: npm ci
      - name: Build Cuppet TypeScript workspaces
        run: |
          npm run build --workspace=cuppet
          npm run build --workspace=@cuppet-code/opencode-plugin
      - name: Typecheck PE3 integration
        run: |
          npm run typecheck --workspace=cuppet
          npm run typecheck --workspace=@cuppet-code/opencode-plugin
      - name: Test task affinity router
        run: node --import tsx --test packages/cli/test/task-agents.test.ts
      - name: Test natural semantic routing
        run: >-
          node --import tsx --test
          packages/cli/test/pe3-semantic-router.test.ts
          packages/cli/test/pe3-localizer.test.ts
          packages/cli/test/pe3-model-contract.test.ts
      - name: Test task session routing
        run: node --import tsx --test packages/cli/test/pe3-session-router.test.ts
      - name: Test PE3 benchmark metrics
        run: node --import tsx --test packages/cli/test/pe3-benchmark.test.ts
      - name: Test native derivative contract
        run: node --import tsx --test packages/cli/test/pe3-native-contract.test.ts
      - name: Test cumulative telemetry semantics
        run: node --import tsx --test packages/cli/test/pe3-telemetry.test.ts
      - name: Test local control routing boundary
        run: node --import tsx --test packages/cli/test/control.test.ts
      - name: Test native TUI handoff
        run: node --import tsx --test packages/opencode-plugin/test/pe3-tui.test.ts
      - name: Run persistent-session routing benchmark
        run: npm run eval:pe3:routing
      - name: Build patched OpenCode derivative
        run: node scripts/build-opencode.mjs --source=.opencode-src --output=.opencode/opencode
