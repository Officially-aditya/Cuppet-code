name: Temporary C1 diagnostic fix

on:
  push:
    branches:
      - desktop-c1-tst-edit-rpc

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-c1-tst-edit-rpc
      - run: python3 scripts/.tmp-c1-diagnostic-fix.py
      - name: Commit correction
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tst-core/src/editing.rs
          git commit -m "fix(tst): detect same-count introduced syntax errors"
          git push origin HEAD:desktop-c1-tst-edit-rpc
