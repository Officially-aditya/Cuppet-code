name: C1 clippy fix

on:
  push:
    branches:
      - desktop-c1-tst-edit-rpc

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-c1-tst-edit-rpc
      - name: Apply lint-only cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('crates/tst-core/src/editing.rs')
          s = p.read_text()
          s = s.replace('fn push_target(\n', '#[allow(clippy::too_many_arguments)]\nfn push_target(\n', 1)
          s = s.replace('format!("resolve {}", requested)', 'format!("resolve {requested}")')
          s = s.replace('anyhow!("new staged file already exists: {}", requested)', 'anyhow!("new staged file already exists: {requested}")')
          s = s.replace('anyhow!("no existing project ancestor for {}", requested)', 'anyhow!("no existing project ancestor for {requested}")')
          p.write_text(s)
          PY
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.88'
          components: rustfmt
      - run: cargo fmt --all
      - name: Commit lint cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/tst-core/src/editing.rs
          git commit -m "fix(tst): satisfy C1 clippy gate"
          git push origin HEAD:desktop-c1-tst-edit-rpc
